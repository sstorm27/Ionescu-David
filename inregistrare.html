<!DOCTYPE html>
  <link rel="stylesheet" href="inregistrare.css">
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Înregistrare</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <h1>Creare cont nou</h1>

  <form action="#" method="post">
    <label for="username">Nume utilizator:</label><br>
    <input type="text" id="username" name="username" required><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br>

    <label for="password">Parolă:</label><br>
    <input type="password" id="password" name="password" required><br>

    <label for="confirm">Confirmă parola:</label><br>
    <input type="password" id="confirm" name="confirm" required><br>

    <button type="submit">Înregistrează-te</button>
  </form>

  <p>Ai deja cont? <a href="login.html">Conectează-te aici</a></p>
  <a href="index.html" class="back">Înapoi acasă</a>

</body>
</html>
